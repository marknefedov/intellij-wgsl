# GitHub Actions Workflow created for handling the release process based on the draft release prepared with the Build workflow.
# Running the publishPlugin task requires all the following secrets to be provided: PUBLISH_TOKEN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD, CERTIFICATE_CHAIN.
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html for more information.

name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to JetBrains Marketplace
        required: true
        type: string

jobs:

  # Prepare and publish the plugin to JetBrains Marketplace repository
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:

      # Check out the current repository
      - name: Fetch Sources
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check release version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^pluginVersion *= *//p' gradle.properties | tr -d '\r')
          test "$RELEASE_TAG" = "v$VERSION"

      # Set up Java environment for the next steps
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 21

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      # Set environment variables
      - name: Export Properties
        id: properties
        shell: bash
        env:
          RELEASE_NOTES: ${{ github.event.release.body }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            RELEASE_NOTES="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          fi
          CHANGELOG="$(printf '%s\n' "$RELEASE_NOTES" | sed -e 's/^[[:space:]]*$//g' -e '/./,$!d')"
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Update the Unreleased section with the current release note
      - name: Patch Changelog
        if: ${{ steps.properties.outputs.changelog != '' }}
        env:
          CHANGELOG: ${{ steps.properties.outputs.changelog }}
        run: |
          ./gradlew patchChangelog --release-note="$CHANGELOG"

      # Publish the plugin to JetBrains Marketplace
      - name: Test and verify plugin
        run: ./gradlew test buildPlugin verifyPluginStructure verifyPlugin

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          PUBLISH_TOKEN="$(printf '%s' "$PUBLISH_TOKEN" | tr -d '\r\n')"
          test -n "$PUBLISH_TOKEN"
          echo "::add-mask::$PUBLISH_TOKEN"
          ./gradlew publishPlugin

      # Create a pull request
      - name: Create Pull Request
        if: ${{ steps.properties.outputs.changelog != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="$RELEASE_TAG"
          BRANCH="changelog-update-$VERSION"
          LABEL="release changelog"

          git config user.email "action@github.com"
          git config user.name "GitHub Action"

          cp CHANGELOG.md "$RUNNER_TEMP/release-changelog.md"
          git restore CHANGELOG.md
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -b "$BRANCH" "origin/$DEFAULT_BRANCH"
          cp "$RUNNER_TEMP/release-changelog.md" CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Changelog update - $VERSION"
          git push --set-upstream origin "$BRANCH"
          
          gh label create "$LABEL" \
            --description "Pull requests with release changelog update" \
            --force \
            || true

          gh pr create \
            --title "Changelog update - \`$VERSION\`" \
            --body "Current pull request contains patched \`CHANGELOG.md\` file for the \`$VERSION\` version." \
            --label "$LABEL" \
            --head $BRANCH
