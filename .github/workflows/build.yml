name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package
        shell: bash
        run: ./gradlew test buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.os }}
          path: build/distributions/*.zip

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verifier
          path: build/reports/pluginVerifier/

  releaseDraft:
    name: Release draft
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release notes
        shell: bash
        run: |
          VERSION=$(sed -n 's/^pluginVersion *= *//p' gradle.properties | tr -d '\r')
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew getChangelog --unreleased --no-header --console=plain -q > release-notes.md
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            if [ "$(cat draft-state.txt)" = true ]; then
              gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
            fi
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
          fi
