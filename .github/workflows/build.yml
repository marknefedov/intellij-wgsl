name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stableRelease:
    name: Check latest stable IntelliJ release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check JetBrains release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          properties = dict(line.split('=', 1) for line in pathlib.Path('gradle.properties').read_text().splitlines() if '=' in line)
          properties = {key.strip(): value.strip() for key, value in properties.items()}
          url = 'https://data.services.jetbrains.com/products/releases?code=IIU&type=release&latest=true'
          with urllib.request.urlopen(url, timeout=30) as response:
              release = json.load(response)['IIU'][0]
          expected = (release['version'], release['build'])
          configured = (properties['platformVersion'], properties['pluginSinceBuild'])
          print(f'Configured platform/minimum: {configured}; latest stable: {expected}')
          if configured != expected:
              raise SystemExit(f'::error::Update platformVersion and pluginSinceBuild to IntelliJ IDEA {expected[0]} ({expected[1]})')
          PY

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Test and package
        shell: bash
        run: ./gradlew test buildPlugin verifyPluginStructure
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: build/reports/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: plugin-${{ matrix.os }}
          path: build/distributions/*.zip

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: ./gradlew verifyPlugin
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: plugin-verifier
          path: build/reports/pluginVerifier/

  testEap:
    name: test (latest EAP, or stable between cycles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - run: ./gradlew test -PuseEap=true
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: reports-eap
          path: build/reports/

  releaseDraft:
    name: Release draft
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, verify, testEap, stableRelease]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Prepare release notes
        shell: bash
        run: |
          VERSION=$(sed -n 's/^pluginVersion *= *//p' gradle.properties | tr -d '\r')
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew getChangelog --unreleased --no-header --console=plain -q > release-notes.md
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v$RELEASE_VERSION"
          if gh release view "$TAG" --json isDraft --jq .isDraft > draft-state.txt 2>/dev/null; then
            if [ "$(cat draft-state.txt)" = true ]; then
              gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
            fi
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file release-notes.md
          fi
